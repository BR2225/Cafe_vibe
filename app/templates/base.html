<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d14">
  <title>{% block title %}{{ cafe }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M4 8h9v5a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8Z' fill='none' stroke='%232b1d14' stroke-width='1.6'/><path d='M13 9.5h1.5a2 2 0 0 1 0 4H13' fill='none' stroke='%232b1d14' stroke-width='1.6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}" data-currency="{{ currency }}">
  {% block body %}{% endblock %}
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/icons.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
