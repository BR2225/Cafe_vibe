<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d14">
  <title>{% block title %}{{ cafe }}{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M4 8h9v5a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V8Z' fill='none' stroke='%232b1d14' stroke-width='1.6'/><path d='M13 9.5h1.5a2 2 0 0 1 0 4H13' fill='none' stroke='%232b1d14' stroke-width='1.6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="{% block bodyclass %}{% endblock %}" data-currency="{{ currency }}">
  <div class="lang-switch notranslate" translate="no">
    <select id="langSelect" aria-label="Choose language">
      <option value="en">English</option>
      <option value="hi">हिन्दी</option>
      <option value="bn">বাংলা</option>
      <option value="te">తెలుగు</option>
      <option value="mr">मराठी</option>
      <option value="ta">தமிழ்</option>
      <option value="ur">اردو</option>
      <option value="gu">ગુજરાતી</option>
      <option value="kn">ಕನ್ನಡ</option>
      <option value="ml">മലയാളം</option>
      <option value="pa">ਪੰਜਾਬੀ</option>
      <option value="or">ଓଡ଼ିଆ</option>
      <option value="as">অসমীয়া</option>
      <option value="ne">नेपाली</option>
      <option value="sd">سنڌي</option>
      <option value="sa">संस्कृतम्</option>
    </select>
  </div>
  <div id="google_translate_element" style="display:none"></div>
  {% block body %}{% endblock %}
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="/static/icons.js"></script>
  <script src="/static/translate.js"></script>
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateInit" async defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
